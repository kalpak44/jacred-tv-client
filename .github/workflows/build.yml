name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.11 refuses to run on an older JDK, and the module compiles with
      # source/target 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The wrapper jar is committed, so confirm it is an official Gradle release
      # before this job executes it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Lint is a build gate (abortOnError), so it fails the job rather than
      # printing a report nobody opens. The app resolves no third-party artifacts,
      # so this is the whole build.
      - name: Assemble debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Report what was built
        run: |
          {
            echo "### APKs"
            echo
            echo "| Variant | Size | Installs on the Mi Box |"
            echo "| --- | --- | --- |"
            for apk in app/build/outputs/apk/*/*.apk; do
              variant=$(basename "$(dirname "$apk")")
              size=$(du -h "$apk" | cut -f1)
              if [ "$variant" = "debug" ]; then
                installs="yes — signed with the debug key"
              else
                installs="no — unsigned, sign it first"
              fi
              echo "| $variant | $size | $installs |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # minSdk 28 matches the Mi Box 4 (Android 9). The app has no native code and
      # the build declares no ABI splits, so this one APK covers every ABI.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jacred-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Minified and resource-shrunk. Unsigned, because the signing material is
      # deliberately absent from the repository — sign it before a device will
      # accept it.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jacred-tv-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
